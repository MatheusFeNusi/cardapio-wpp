<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Acarajé da Baiana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #F5EBDC;
      --surface: #FFFFFF;
      --card: #FFFFFF;
      --border: #E8D8C3;
      --amber: #D62300;
      --amber-dark: #A51B00;
      --orange: #FF8732;
      --gold: #F2A900;
      --green: #2D8B37;
      --blue: #1A5FA0;
      --red: #D62300;
      --brown: #502314;
      --brown-light: #8c6a5d;
      --text: #502314;
      --text2: #7A5C51;
      --text3: #A68A80;
      --radius: 20px;
      --shadow: 0 8px 30px rgba(80, 35, 20, 0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-size: 1.1rem;
    }

    /* AUTH */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #auth-screen.hidden {
      display: none
    }

    .auth-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 12px 0 var(--border)
    }

    .auth-logo {
      font-size: 3rem;
      background: var(--orange);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 4px 0 #D96D1E;
      border: 3px solid #fff;
    }

    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--amber);
      margin-bottom: .3rem
    }

    .auth-sub {
      font-size: 1.1rem;
      color: var(--text2);
      margin-bottom: 1.8rem;
      font-weight: 500
    }

    .auth-input {
      width: 100%;
      background: #FDF9F3;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      color: var(--brown);
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      outline: none;
      margin-bottom: 1rem;
      text-align: center;
      transition: all .2s;
      box-shadow: 0 3px 0 var(--border);
    }

    .auth-input:focus {
      border-color: var(--orange);
      background: #fff;
      box-shadow: 0 3px 0 var(--orange);
    }

    .auth-btn {
      width: 100%;
      background: var(--amber);
      border: none;
      border-radius: 12px;
      padding: 1.1rem;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .1s;
      box-shadow: 0 4px 0 var(--amber-dark);
    }

    .auth-btn:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b51c00
    }

    .auth-btn:active {
      transform: translateY(4px);
      box-shadow: none
    }

    .auth-err {
      color: var(--red);
      font-size: .85rem;
      margin-top: .6rem;
      min-height: 1.2rem;
      font-weight: 600
    }

    /* HEADER */
    .header {
      background: var(--brown);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #F5EBDC;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand small {
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
      border: 2px solid var(--amber)
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(74, 222, 128, .6)
      }

      70% {
        box-shadow: 0 0 0 10px rgba(74, 222, 128, 0)
      }

      100% {
        box-shadow: 0 0 0 0
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .countdown-txt {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'DM Mono', monospace;
      font-weight: 600
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      border-radius: 8px;
      padding: .5rem 1.2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      display: inline-block
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.3)
    }

    .btn-refresh {
      background: var(--gold);
      color: var(--text);
      box-shadow: 0 3px 0 #d99600
    }

    .btn-refresh:hover {
      transform: translateY(1px);
      box-shadow: 0 2px 0 #d99600;
      background: #fcd55c
    }

    .btn-refresh:active {
      transform: translateY(3px);
      box-shadow: none
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      user-select: none;
      font-weight: 600
    }

    .sound-toggle:hover {
      color: #fff
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg);
    }

    .stat {
      background: var(--surface);
      padding: 1.2rem;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      text-align: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--border);
    }

    .stat:hover {
      transform: translateY(-4px);
      border-color: var(--orange);
      box-shadow: 0 8px 0 var(--border);
    }

    .stat.active {
      border-color: var(--orange);
      background: #FFF9F5;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.4rem;
      color: var(--brown);
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text3);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      padding: 0 1.5rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      background: var(--bg);
    }

    .pill {
      background: #fff;
      border: 2px solid var(--border);
      color: var(--text2);
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 0 var(--border);
    }

    .pill:hover {
      border-color: var(--orange);
      color: var(--brown);
    }

    .pill.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      box-shadow: 0 3px 0 #D96D1E;
    }

    .search {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
      min-width: 250px;
      outline: none;
      box-shadow: 0 3px 0 var(--border);
    }

    .grid {
      padding: 0 1.5rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
        padding: 0 1rem 2rem;
      }
      .toolbar {
        padding: 0 1rem 1.5rem;
      }
      .stats {
        padding: 1rem;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text3)
    }

    .empty-ic {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      color: var(--border2)
    }

    .loading-wrap {
      grid-column: 1/-1;
      text-align: center;
      padding: 4rem;
      color: var(--text3);
      font-weight: 600
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--amber-pale);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 1rem
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(5px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* CARD */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 0 var(--border);
      transition: all 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 0 var(--border);
      border-color: var(--orange);
    }

    .card.is-new {
      border-color: var(--amber);
      animation: pulse-card 2s infinite;
    }

    @keyframes pulse-card {
      0% { box-shadow: 0 6px 0 var(--amber); }
      50% { box-shadow: 0 6px 20px rgba(214, 35, 0, 0.3); }
      100% { box-shadow: 0 6px 0 var(--amber); }
    }

    .card.is-new {
      border-color: var(--amber-pale);
      box-shadow: 0 6px 0 var(--amber-pale)
    }

    .card-top {
      padding: 1.2rem;
      background: #FFFBF5;
      border-bottom: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .order-id {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 0.05em;
    }

    .order-hr {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--brown);
      margin-top: 0.2rem;
    }

    .badge {
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .b-aguardando_pagamento { background: #FFF9E6; color: #D97706; border: 2px solid #FDE68A; }
    .b-pago { background: #E6F0FA; color: var(--blue); border: 2px solid #BFDBFE; }
    .b-em_preparo { background: #FEF3C7; color: #D97706; border: 2px solid #FDE68A; }
    .b-pronto { background: #E9F5EC; color: var(--green); border: 2px solid #BBF7D0; }
    .b-saiu_entrega { background: #FFF3E0; color: #E65100; border: 2px solid #FFCC80; }
    .b-entregue { background: #F3F4F6; color: var(--text3); border: 2px solid #E5E7EB; }
    .b-cancelado { background: #FFEAE8; color: var(--red); border: 2px solid #FECACA; }

    .card-body {
      padding: 1.5rem;
      flex: 1;
    }

    .cli-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--brown);
      margin-bottom: 0.2rem;
    }

    .cli-tel {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      color: var(--text3);
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1rem;
      color: var(--text2);
      margin-bottom: 0.6rem;
      font-weight: 600;
    }

    .ic {
      font-size: 1.2rem;
    }

    .items-box {
      background: #FDF9F3;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 1rem;
      padding: 1rem;
    }

    .it-row {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .it-row:last-child { margin-bottom: 0; }

    .it-name {
      flex: 1;
      color: var(--brown);
      font-weight: 700;
    }

    .it-qty {
      color: var(--text3);
      font-weight: 700;
    }

    .it-val {
      font-family: 'DM Mono', monospace;
      font-weight: 700;
      color: var(--brown);
    }

    .tot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border);
    }

    .tot-lbl {
      font-size: 0.9rem;
      color: var(--text3);
      font-weight: 800;
      text-transform: uppercase;
    }

    .tot-val {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--amber);
    }

    .card-actions {
      display: flex;
      gap: 0.6rem;
      padding: 1.2rem;
      background: #FFFBF5;
      border-top: 2px solid var(--border);
    }

    .act {
      flex: 1;
      padding: 0.8rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 var(--border);
    }

    .act:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .a-preparo { background: var(--gold); color: #fff; box-shadow: 0 4px 0 #C98B00; }
    .a-pronto { background: var(--green); color: #fff; box-shadow: 0 4px 0 #1E6625; }
    .a-entrega { background: var(--orange); color: #fff; box-shadow: 0 4px 0 #D96D1E; }
    .a-entregue { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #124B80; }
    
    .a-cancel {
      flex: 0;
      min-width: 48px;
      background: #fff;
      color: var(--red);
      border: 2px solid var(--border);
      box-shadow: 0 4px 0 var(--border);
    }

    .a-print {
      flex: 0;
      min-width: 48px;
      background: #fff;
      color: var(--brown);
      border: 2px solid var(--border);
      box-shadow: 0 4px 0 var(--border);
    }

    /* PRINT */
    .p-overlay {
      position: fixed;
      inset: 0;
      background: rgba(80, 35, 20, .6);
      backdrop-filter: blur(3px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center
    }

    .p-overlay.open {
      display: flex
    }

    .print-wrap {
      background: #fff;
      color: #000;
      border-radius: 24px;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 12px 0 #d96d1e;
      border: 4px solid var(--amber-pale)
    }

    .print-box {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold
    }

    .print-box h3 {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px
    }

    .sep {
      border: none;
      border-top: 2px dashed #000;
      margin: .6rem 0
    }

    .pr-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px
    }

    .pr-total {
      font-weight: bold;
      font-size: 15px;
      margin-top: 6px
    }

    .print-btns {
      display: flex;
      gap: .8rem;
      margin-top: 1.5rem
    }

    .do-print,
    .cl-print {
      flex: 1;
      padding: .8rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 0 #b51c00;
      transition: transform .1s
    }

    .do-print:active,
    .cl-print:active {
      transform: translateY(4px);
      box-shadow: none
    }

    .do-print {
      background: var(--amber);
      color: #fff
    }

    .cl-print {
      background: #f3f4f6;
      color: var(--text2);
      box-shadow: 0 4px 0 #e5e7eb
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--dark);
      color: #fff;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      font-size: .9rem;
      font-weight: 700;
      z-index: 300;
      animation: fi .2s ease;
      box-shadow: 0 8px 20px rgba(80, 35, 20, 0.3);
      border: 2px solid #663322
    }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">🫓</div>
      <div class="auth-title">Acarajé da Baiana</div>
      <div class="auth-sub">Painel do operador</div>
      <input id="auth-pwd" class="auth-input" type="password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-btn" onclick="doLogin()">Entrar</button>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="live-dot"></div>
      <div class="brand">Acarajé da Baiana <small>Painel do operador</small></div>
    </div>
    <div class="header-right">
      <span class="countdown-txt">↻ <span id="cd">30</span>s</span>
      <label class="sound-toggle">
        <input type="checkbox" id="soundOn" checked style="display:none">
        <span id="sIco">🔔</span><span id="sLbl">Som</span>
      </label>
      <button class="btn-sm btn-refresh" onclick="load(true)">⟳ Atualizar</button>
      <a href="/admin" class="btn-sm">📦 Produtos</a>
      <button class="btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat s-aguardando" onclick="setF('aguardando_pagamento')">
      <div class="stat-num" id="nAg">—</div>
      <div class="stat-lbl">⏳ Aguardando</div>
    </div>
    <div class="stat s-pago" onclick="setF('pago')">
      <div class="stat-num" id="nPg">—</div>
      <div class="stat-lbl">💳 Pago</div>
    </div>
    <div class="stat s-preparo" onclick="setF('em_preparo')">
      <div class="stat-num" id="nPr">—</div>
      <div class="stat-lbl">🔥 Preparo</div>
    </div>
    <div class="stat s-pronto" onclick="setF('pronto')">
      <div class="stat-num" id="nPt">—</div>
      <div class="stat-lbl">✅ Pronto</div>
    </div>
    <div class="stat s-fat" title="Hoje">
      <div class="stat-num" id="nFatHoje" style="color:var(--green)">R$0</div>
      <div class="stat-lbl">💰 Hoje</div>
    </div>
    <div class="stat s-fat" title="7 Dias">
      <div class="stat-num" id="nFat7d" style="color:var(--amber-pale)">R$0</div>
      <div class="stat-lbl">📅 7 Dias</div>
    </div>
    <div class="stat s-fat" title="Mês">
      <div class="stat-num" id="nFatMes" style="color:var(--amber)">R$0</div>
      <div class="stat-lbl">📊 Mês</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="pill active" id="f-ativos" onclick="setF('ativos')">🟠 Ativos</button>
    <button class="pill" id="f-aguardando_pagamento" onclick="setF('aguardando_pagamento')">⏳ Aguardando PIX</button>
    <button class="pill" id="f-em_preparo" onclick="setF('em_preparo')">🔥 Em preparo</button>
    <button class="pill" id="f-pronto" onclick="setF('pronto')">✅ Prontos</button>
    <button class="pill" id="f-entregue" onclick="setF('entregue')">📦 Entregues</button>
    <button class="pill" id="f-todos" onclick="setF('todos')">Todos</button>
    <input class="search" id="srch" placeholder="🔍 Nome ou tel..." oninput="render()">
  </div>

  <div class="grid" id="grid">
    <div class="loading-wrap">
      <div class="spinner"></div>Carregando...
    </div>
  </div>

  <div class="p-overlay" id="pOverlay">
    <div class="print-wrap">
      <div class="print-box" id="pBox"></div>
      <div class="print-btns">
        <button class="do-print" onclick="doPrint()">🖨️ Imprimir</button>
        <button class="cl-print" onclick="closePrint()">✕ Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://ukmbexntrxgzxgkvhpfx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWJleG50cnhnenhna3ZocGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Njk2OTUsImV4cCI6MjA5MzE0NTY5NX0.Tq_WsZGMNRDw4Zme9YBuw2i6fJIy6WYz3xFvbdcOmno';
    const SBH = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    const SBH2 = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

    let pedidos = [], filter = 'ativos', known = new Set(), cdTimer = null, cdVal = 30;

    /* AUTH */
    async function doLogin() {
      const pwd = document.getElementById('auth-pwd').value.trim();
      if (!pwd) return;
      const errEl = document.getElementById('auth-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`${SB_URL}/rest/v1/configuracoes?chave=eq.dashboard_senha&select=valor`, { headers: SBH2 });
        const data = await r.json();
        const certa = data[0]?.valor || 'baiana@2025';
        if (pwd === certa) {
          sessionStorage.setItem('dash_auth', '1');
          document.getElementById('auth-screen').classList.add('hidden');
          load(true);
        } else {
          errEl.textContent = 'Senha incorreta';
          document.getElementById('auth-pwd').select();
        }
      } catch (e) { errEl.textContent = 'Erro de conexão'; }
    }

    function doLogout() { sessionStorage.removeItem('dash_auth'); location.reload(); }

    if (sessionStorage.getItem('dash_auth') === '1') {
      document.getElementById('auth-screen').classList.add('hidden');
      window.onload = () => load(true);
    } else {
      window.onload = () => {
        const input = document.getElementById('auth-pwd');
        if (input) input.focus();
      }
    }

    /* SOM */
    const sOn = document.getElementById('soundOn');
    sOn.addEventListener('change', () => {
      document.getElementById('sIco').textContent = sOn.checked ? '🔔' : '🔕';
      document.getElementById('sLbl').textContent = sOn.checked ? 'Som' : 'Mudo';
    });
    function beep() {
      if (!sOn.checked) return;
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        [[880, .0], [1100, .12], [880, .24]].forEach(([f, t]) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.frequency.value = f; o.type = 'sine';
          g.gain.setValueAtTime(0, ac.currentTime + t);
          g.gain.linearRampToValueAtTime(.3, ac.currentTime + t + .02);
          g.gain.linearRampToValueAtTime(0, ac.currentTime + t + .1);
          o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .15);
        });
      } catch (e) { }
    }

    /* CARREGAR */
    async function load(show = false) {
      if (sessionStorage.getItem('dash_auth') !== '1') return;
      if (show) document.getElementById('grid').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>Carregando...</div>';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      try {
        console.log('Iniciando carga de pedidos...');
        const r = await fetch(
          `${SB_URL}/rest/v1/pedidos?created_at=gte.${hoje.toISOString()}&select=id,telefone,nome_cliente,nome_cliente_pedido,itens,total,tipo_entrega,endereco,endereco_entrega,forma_pagamento,valor_troco,precisa_troco,status,created_at,asaas_payment_id,asaas_payment_link&order=created_at.desc&limit=200`,
          { headers: SBH2 }
        );
        if (!r.ok) {
          const txt = await r.text();
          throw new Error(`Erro API (${r.status}): ${txt}`);
        }
        const data = await r.json();
        console.log('Pedidos carregados:', data.length);
        const isFirst = known.size === 0;
        if (!isFirst) {
          data.forEach(p => {
            if (!known.has(p.id)) { beep(); toast('🆕 Novo pedido — ' + (p.nome_cliente || p.nome_cliente_pedido || 'Cliente')); }
          });
        }
        known = new Set(data.map(p => p.id));
        pedidos = data; stats(); render();
      } catch (e) {
        console.error('Erro ao carregar:', e);
        if (show) document.getElementById('grid').innerHTML = `<div class="empty"><div class="empty-ic">⚠️</div><p>Erro ao carregar dados: ${e.message}</p><button class="btn-sm" onclick="load(true)" style="margin-top:1rem;background:var(--amber)">Tentar novamente</button></div>`;
      }
      resetCd();
    }

    /* STATS */
    function stats() {
      const c = s => pedidos.filter(p => p.status === s).length;
      document.getElementById('nAg').textContent = c('aguardando_pagamento');
      document.getElementById('nPg').textContent = c('pago');
      document.getElementById('nPr').textContent = c('em_preparo');
      document.getElementById('nPt').textContent = c('pronto');
      
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const last7d = today - (7 * 24 * 60 * 60 * 1000);
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

      const calc = (since) => pedidos
        .filter(p => ['pago', 'em_preparo', 'pronto', 'saiu_entrega', 'entregue'].includes(p.status))
        .filter(p => new Date(p.created_at).getTime() >= since)
        .reduce((s, p) => s + parseFloat(p.total || 0), 0);

      document.getElementById('nFatHoje').textContent = 'R$' + calc(today).toFixed(0);
      document.getElementById('nFat7d').textContent = 'R$' + calc(last7d).toFixed(0);
      document.getElementById('nFatMes').textContent = 'R$' + calc(startOfMonth).toFixed(0);
    }

    function setF(f) {
      filter = f;
      document.querySelectorAll('.pill').forEach(e => e.classList.remove('active'));
      const el = document.getElementById('f-' + f); if (el) el.classList.add('active');
      render();
    }

    function getLista() {
      let l = [...pedidos];
      const q = document.getElementById('srch').value.toLowerCase().trim();
      if (filter === 'ativos') l = l.filter(p => ['aguardando_pagamento', 'pago', 'em_preparo', 'pronto', 'saiu_entrega'].includes(p.status));
      else if (filter !== 'todos') l = l.filter(p => p.status === filter);
      if (q) l = l.filter(p => {
        const n = (p.nome_cliente || p.nome_cliente_pedido || '').toLowerCase();
        return n.includes(q) || (p.telefone || '').includes(q);
      });
      return l;
    }

    const SL = {
      aguardando_pagamento: '⏳ Aguardando',
      pago: '💳 Pago',
      em_preparo: '🔥 Em preparo',
      pronto: '✅ Pronto',
      saiu_entrega: '🛵 Saiu p/ Entrega',
      entregue: '📦 Entregue',
      cancelado: '❌ Cancelado'
    };
    const R = v => 'R$' + parseFloat(v || 0).toFixed(2).replace('.', ',');
    const T = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

    /* RENDER */
    function render() {
      const l = getLista();
      const g = document.getElementById('grid');
      if (!l.length) {
        g.innerHTML = `<div class="empty"><div class="empty-ic">🫓</div><p>Nenhum pedido encontrado</p></div>`;
        return;
      }
      g.innerHTML = l.map(p => {
        const nome = p.nome_cliente || p.nome_cliente_pedido || 'Cliente';
        const tel = p.telefone || '';
        const itens = Array.isArray(p.itens) ? p.itens : [];
        const id8 = 'Ped-' + String(p.id).slice(0, 8).toUpperCase();
        const isNew = !['entregue', 'cancelado'].includes(p.status) && (Date.now() - new Date(p.created_at).getTime()) < 120000;
        const endStr = p.endereco_entrega || p.endereco || '';
        const pgStr = (p.forma_pagamento || '—').toUpperCase();
        const trocoInfo = (p.precisa_troco && p.valor_troco > 0) ? ` · Troco p/ ${R(p.valor_troco)}` : '';
        const pixLink = p.asaas_payment_link ? ` · <a href="${p.asaas_payment_link}" target="_blank" style="color:var(--amber);text-decoration:none;font-weight:700">Link PIX ↗</a>` : '';

        const iHTML = itens.map(i => {
          const qtd = i.quantidade || i.qty || 1;
          const sub = parseFloat(i.subtotal) || (parseFloat(i.preco || 0) * qtd);
          return `<div class="it-row"><span class="it-name">${i.nome || ''}</span><span class="it-qty">×${qtd}</span><span class="it-val">${R(sub)}</span></div>`;
        }).join('');

        let acts = '';
        if (p.status === 'pago') acts += `<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status === 'aguardando_pagamento' && p.forma_pagamento !== 'pix') acts += `<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status === 'em_preparo') acts += `<button class="act a-pronto" onclick="upd('${p.id}','pronto')">✅ Pronto</button>`;
        else if (p.status === 'pronto' && p.tipo_entrega === 'entrega') acts += `<button class="act a-entrega" onclick="upd('${p.id}','saiu_entrega')">🛵 Saiu</button>`;
        else if (p.status === 'pronto' && p.tipo_entrega !== 'entrega') acts += `<button class="act a-entregue" onclick="upd('${p.id}','entregue')">📦 Entregar</button>`;
        else if (p.status === 'saiu_entrega') acts += `<button class="act a-entregue" onclick="upd('${p.id}','entregue')">📦 Entregue</button>`;
        
        if (!['entregue', 'cancelado'].includes(p.status)) acts += `<button class="act a-cancel" onclick="upd('${p.id}','cancelado')" title="Cancelar">✕</button>`;
        if (p.status === 'entregue' || p.status === 'cancelado') acts += `<button class="act a-cancel" onclick="delOrder('${p.id}')" title="Excluir Permanentemente">🗑️</button>`;
        acts += `<button class="act a-print" onclick="openPrint('${p.id}')">🖨️</button>`;

        return `
          <div class="card${isNew ? ' is-new' : ''}" id="c-${p.id}">
            <div class="card-top">
              <div>
                <div class="order-id">${id8}</div>
                <div class="order-hr">🕒 ${T(p.created_at)}</div>
              </div>
              <span class="badge b-${p.status}">${SL[p.status] || p.status}</span>
            </div>
            <div class="card-body">
              <div class="cli-name">${nome}</div>
              <div class="cli-tel">📱 ${tel}</div>
              <div class="info-row"><span class="ic">${p.tipo_entrega === 'entrega' ? '🛵' : '🏃'}</span><span>${p.tipo_entrega === 'entrega' ? endStr : 'Retirada no local'}</span></div>
              <div class="info-row"><span class="ic">💰</span><span>${pgStr}${trocoInfo}${pixLink}</span></div>
              <div class="items-box">${iHTML || '<span style="color:var(--text3)">Sem itens</span>'}</div>
              <div class="tot-row"><span class="tot-lbl">Total do Pedido</span><span class="tot-val">${R(p.total)}</span></div>
            </div>
            <div class="card-actions">${acts}</div>
          </div>`;
      }).join('');
    }n>'}</div>
  <div class="tot-row"><span class="tot-lbl">Total</span><span class="tot-val">${R(p.total)}</span></div>
</div>
<div class="card-actions">${acts}</div></div>`;
      }).join('');
    }

    /* ATUALIZAR STATUS */
    async function delOrder(id) {
      if (!confirm('Deseja excluir este pedido permanentemente? Esta ação não pode ser desfeita.')) return;
      try {
        const r = await fetch(`${SB_URL}/rest/v1/pedidos?id=eq.${id}`, {
          method: 'DELETE',
          headers: SBH
        });
        if (!r.ok) throw new Error('Erro ao excluir');
        toast('🗑️ Pedido excluído com sucesso');
        load(true);
      } catch (e) {
        toast('❌ Erro: ' + e.message);
      }
    }

    async function upd(id, st) {
      const btns = document.querySelectorAll(`#c-${id} .act`);
      btns.forEach(b => b.disabled = true);
      try {
        const r = await fetch(`${SB_URL}/rest/v1/pedidos?id=eq.${id}`, {
          method: 'PATCH', headers: { ...SBH, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: st })
        });
        if (!r.ok) {
          const errText = await r.text();
          throw new Error(`${r.status}: ${errText}`);
        }
        const p = pedidos.find(x => x.id === id);
        if (p) p.status = st;
        stats(); render(); toast('Status: ' + (SL[st] || st));
      } catch (e) { toast('Erro: ' + e.message); btns.forEach(b => b.disabled = false); }
    }

    /* IMPRESSÃO */
    function openPrint(id) {
      const p = pedidos.find(x => x.id === id); if (!p) return;
      const nome = p.nome_cliente || p.nome_cliente_pedido || 'Cliente';
      const tel = p.telefone || '';
      const id8 = 'Ped-' + String(p.id).slice(0, 8).toUpperCase();
      const itens = Array.isArray(p.itens) ? p.itens : [];
      const taxa = p.tipo_entrega === 'entrega' ? 5 : 0;
      const data = new Date(p.created_at).toLocaleString('pt-BR');
      const endStr = p.endereco || p.endereco_entrega || '';
      const iRows = itens.map(i => { const qtd = i.quantidade || i.qty || 1; const sub = parseFloat(i.subtotal) || (parseFloat(i.preco || 0) * qtd); return `<div class="pr-row"><span>${qtd}x ${i.nome || ''}</span><span>${R(sub)}</span></div>`; }).join('');
      const taxaRow = taxa ? `<div class="pr-row"><span>Taxa entrega</span><span>R$5,00</span></div>` : '';
      const trocoRow = (p.precisa_troco && p.valor_troco > 0) ? `<div class="pr-row"><span>Troco para</span><span>${R(p.valor_troco)}</span></div>` : '';
      document.getElementById('pBox').innerHTML = `<h3>🫓 ACARAJÉ DA BAIANA</h3><div style="text-align:center;font-size:10px;color:#888">${data}</div><hr class="sep"><div><strong>Pedido ${id8}</strong></div><div>Cliente: ${nome}</div><div>Tel: ${tel}</div><hr class="sep"><div><strong>${p.tipo_entrega === 'entrega' ? '🛵 ENTREGA' : '🏃 RETIRADA'}</strong></div>${p.tipo_entrega === 'entrega' && endStr ? `<div style="font-size:10px">${endStr}</div>` : ''}<hr class="sep"><strong>ITENS</strong>${iRows}${taxaRow}<hr class="sep"><div class="pr-row pr-total"><span>TOTAL</span><span>${R(p.total)}</span></div>${trocoRow}<div style="font-size:10px;color:#666">Pgto: ${(p.forma_pagamento || '—').toUpperCase()} · Status: ${SL[p.status] || p.status}</div><hr class="sep"><div style="text-align:center;font-size:10px;color:#aaa">Obrigada pela preferência! 💛</div>`;
      document.getElementById('pOverlay').classList.add('open');
    }
    function doPrint() { const c = document.getElementById('pBox').innerHTML; const w = window.open('', '_blank', 'width=380,height=620'); w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pedido</title><style>body{font-family:'Courier New',monospace;font-size:12px;padding:1cm;max-width:8cm;margin:0 auto}h3{font-size:13px;text-align:center}.sep{border:none;border-top:1px dashed #000;margin:.4rem 0}.pr-row{display:flex;justify-content:space-between}.pr-total{font-weight:bold;font-size:13px}</style></head><body>${c}<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),500)}<\/script></body></html>`); w.document.close(); }
    function closePrint() { document.getElementById('pOverlay').classList.remove('open'); }
    document.getElementById('pOverlay').addEventListener('click', e => { if (e.target === document.getElementById('pOverlay')) closePrint(); });

    /* COUNTDOWN */
    function resetCd() { clearInterval(cdTimer); cdVal = 30; document.getElementById('cd').textContent = cdVal; cdTimer = setInterval(() => { cdVal--; document.getElementById('cd').textContent = cdVal; if (cdVal <= 0) { clearInterval(cdTimer); load(); } }, 1000); }

    /* TOAST */
    let tTimer = null;
    function toast(msg) { clearTimeout(tTimer); let t = document.querySelector('.toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); tTimer = setTimeout(() => t.remove(), 3000); }

    if (sessionStorage.getItem('dash_auth') === '1') load(true);
  </script>
</body>

</html>
