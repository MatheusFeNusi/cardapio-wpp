<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Acarajé da Baiana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #FFF5E1;
      --surface: #FFFFFF;
      --card: #FFFFFF;
      --border: #f0d8b6;
      --border2: #e6c8a0;
      --amber: #D62300;
      --amber2: #b51c00;
      --amber-pale: #FF8732;
      --gold: #F2A900;
      --green: #277C30;
      --green-pale: #e9f5ec;
      --blue: #1A5FA0;
      --blue-pale: #e6f0fa;
      --red: #D62300;
      --red-pale: #ffeae8;
      --text: #502314;
      --text2: #8c6a5d;
      --text3: #a68a80;
      --radius: 16px
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased
    }

    /* AUTH */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #auth-screen.hidden {
      display: none
    }

    .auth-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 12px 0 #f0d8b6
    }

    .auth-logo {
      font-size: 3rem;
      margin-bottom: .5rem;
      background: var(--amber-pale);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 0 #d96d1e;
      border: 3px solid var(--surface)
    }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--amber);
      margin-bottom: .3rem
    }

    .auth-sub {
      font-size: .9rem;
      color: var(--text2);
      margin-bottom: 1.8rem;
      font-weight: 500
    }

    .auth-input {
      width: 100%;
      background: #FFF5E1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      margin-bottom: .8rem;
      text-align: center;
      letter-spacing: .15em;
      transition: border-color .2s
    }

    .auth-input:focus {
      border-color: var(--amber-pale);
      box-shadow: 0 0 0 3px rgba(255, 135, 50, 0.2)
    }

    .auth-btn {
      width: 100%;
      background: var(--amber);
      border: none;
      border-radius: 12px;
      padding: .9rem;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s;
      box-shadow: 0 4px 0 #b51c00
    }

    .auth-btn:hover {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b51c00
    }

    .auth-btn:active {
      transform: translateY(4px);
      box-shadow: none
    }

    .auth-err {
      color: var(--red);
      font-size: .85rem;
      margin-top: .6rem;
      min-height: 1.2rem;
      font-weight: 600
    }

    /* HEADER */
    .header {
      background: var(--amber);
      border-bottom: 3px solid var(--amber2);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: .8rem
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffffff
    }

    .brand small {
      color: var(--gold);
      font-family: 'DM Sans', sans-serif;
      font-weight: 800;
      font-size: .8rem;
      display: block;
      margin-top: -2px;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .live-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
      border: 2px solid var(--amber)
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(74, 222, 128, .6)
      }

      70% {
        box-shadow: 0 0 0 10px rgba(74, 222, 128, 0)
      }

      100% {
        box-shadow: 0 0 0 0
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .countdown-txt {
      font-size: .8rem;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'DM Mono', monospace;
      font-weight: 600
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      border-radius: 8px;
      padding: .4rem .9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      display: inline-block
    }

    .btn-sm:hover {
      background: rgba(255, 255, 255, 0.3)
    }

    .btn-refresh {
      background: var(--gold);
      color: var(--text);
      box-shadow: 0 3px 0 #d99600
    }

    .btn-refresh:hover {
      transform: translateY(1px);
      box-shadow: 0 2px 0 #d99600;
      background: #fcd55c
    }

    .btn-refresh:active {
      transform: translateY(3px);
      box-shadow: none
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      user-select: none;
      font-weight: 600
    }

    .sound-toggle:hover {
      color: #fff
    }

    /* STATS */
    .stats {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 2px solid var(--border)
    }

    .stat {
      flex: 1;
      background: var(--surface);
      padding: .8rem 1rem;
      cursor: pointer;
      transition: background .15s;
      position: relative;
      text-align: center
    }

    .stat:hover,
    .stat.active {
      background: #fffaf0
    }

    .stat.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--amber-pale)
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: .2rem
    }

    .stat-lbl {
      font-size: .7rem;
      color: var(--text2);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .s-aguardando .stat-num {
      color: var(--amber)
    }

    .s-pago .stat-num {
      color: var(--blue)
    }

    .s-preparo .stat-num {
      color: var(--gold)
    }

    .s-pronto .stat-num {
      color: var(--green)
    }

    .s-entregue .stat-num {
      color: var(--text3)
    }

    .s-fat .stat-num {
      color: var(--amber)
    }

    /* TOOLBAR */
    .toolbar {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--border);
      background: var(--surface)
    }

    .pill {
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--text2);
      border-radius: 999px;
      padding: .4rem 1.2rem;
      font-size: .85rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .1s;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border)
    }

    .pill:hover {
      border-color: var(--amber-pale);
      background: #fff9e6;
      color: var(--text)
    }

    .pill.active {
      background: var(--amber-pale);
      border-color: var(--amber-pale);
      color: #fff;
      box-shadow: 0 2px 0 #d96d1e
    }

    .pill:active {
      transform: translateY(2px);
      box-shadow: none
    }

    .search {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: .5rem .8rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      width: 220px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      margin-left: auto
    }

    .search:focus {
      border-color: var(--amber-pale);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 135, 50, 0.2)
    }

    .search::placeholder {
      color: var(--text3)
    }

    /* GRID */
    .grid {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      align-items: start
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text3)
    }

    .empty-ic {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      color: var(--border2)
    }

    .loading-wrap {
      grid-column: 1/-1;
      text-align: center;
      padding: 4rem;
      color: var(--text3);
      font-weight: 600
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--amber-pale);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 1rem
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(5px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      animation: fi .2s ease;
      box-shadow: 0 6px 0 var(--border)
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border2);
      box-shadow: 0 8px 0 var(--border2)
    }

    .card.is-new {
      border-color: var(--amber-pale);
      box-shadow: 0 6px 0 var(--amber-pale)
    }

    .card-top {
      padding: .8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      background: #fffaf0
    }

    .order-id {
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      color: var(--text2);
      font-weight: 700
    }

    .order-hr {
      font-family: 'DM Mono', monospace;
      font-size: .75rem;
      color: var(--text3);
      margin-top: 2px;
      font-weight: 500
    }

    .badge {
      font-size: .7rem;
      font-weight: 800;
      padding: .25rem .8rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap
    }

    .b-aguardando_pagamento {
      background: #fff9e6;
      color: #d97706;
      border: 2px solid #fde68a
    }

    .b-pago {
      background: var(--blue-pale);
      color: var(--blue);
      border: 2px solid #bfdbfe
    }

    .b-em_preparo {
      background: #fef3c7;
      color: #d97706;
      border: 2px solid #fde68a
    }

    .b-pronto {
      background: var(--green-pale);
      color: var(--green);
      border: 2px solid #bbf7d0
    }

    .b-entregue {
      background: #f3f4f6;
      color: var(--text3);
      border: 2px solid #e5e7eb
    }

    .b-cancelado {
      background: var(--red-pale);
      color: var(--red);
      border: 2px solid #fecaca
    }

    .b-saiu_entrega {
      background: #fff3e0;
      color: #e65100;
      border: 2px solid #ffcc80
    }

    .card-body {
      padding: 1.2rem 1rem
    }

    .cli-name {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: .2rem;
      color: var(--text)
    }

    .cli-tel {
      font-size: .8rem;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      margin-bottom: .8rem;
      font-weight: 600
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .85rem;
      color: var(--text2);
      margin-bottom: .4rem;
      font-weight: 600
    }

    .ic {
      font-size: .9rem
    }

    .items-box {
      border-top: 2px dashed var(--border);
      margin-top: 1rem;
      padding-top: 1rem
    }

    .it-row {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      font-size: .85rem;
      margin-bottom: .4rem
    }

    .it-name {
      flex: 1;
      color: var(--text2);
      font-weight: 700
    }

    .it-qty {
      color: var(--text3);
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      white-space: nowrap;
      font-weight: 700
    }

    .it-val {
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .85rem;
      white-space: nowrap;
      font-weight: 800
    }

    .tot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: .8rem;
      border-top: 2px solid var(--border)
    }

    .tot-lbl {
      font-size: .8rem;
      color: var(--text3);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .tot-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--amber)
    }

    .card-actions {
      display: flex;
      gap: .5rem;
      padding: 1rem;
      border-top: 2px solid var(--border);
      background: #fffaf0;
      flex-wrap: wrap
    }

    .act {
      flex: 1;
      min-width: 70px;
      padding: .5rem .6rem;
      border-radius: 8px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .1s;
      white-space: nowrap;
      box-shadow: 0 3px 0 var(--border)
    }

    .act:active {
      transform: translateY(3px);
      box-shadow: none
    }

    .act:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none
    }

    .a-preparo {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 3px 0 #d99600
    }

    .a-preparo:hover {
      background: #fcd55c
    }

    .a-pronto {
      background: var(--green);
      color: #fff;
      box-shadow: 0 3px 0 #1b5e20
    }

    .a-pronto:hover {
      background: #206a28
    }

    .a-entregue {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 3px 0 #154d82
    }

    .a-entregue:hover {
      background: #1a6bc2
    }

    .a-entrega {
      background: var(--amber-pale);
      color: #fff;
      box-shadow: 0 3px 0 #d96d1e
    }

    .a-entrega:hover {
      background: #ff984d
    }

    .a-cancel {
      flex: 0;
      min-width: 36px;
      background: #f3f4f6;
      color: var(--red);
      border: 2px solid #e5e7eb;
      box-shadow: none
    }

    .a-cancel:hover {
      background: var(--red-pale);
      border-color: #fca5a5
    }

    .a-print {
      flex: 0;
      min-width: 36px;
      background: #f3f4f6;
      color: var(--text2);
      border: 2px solid #e5e7eb;
      font-size: .8rem;
      box-shadow: none
    }

    .a-print:hover {
      background: #e5e7eb
    }

    /* PRINT */
    .p-overlay {
      position: fixed;
      inset: 0;
      background: rgba(80, 35, 20, .6);
      backdrop-filter: blur(3px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center
    }

    .p-overlay.open {
      display: flex
    }

    .print-wrap {
      background: #fff;
      color: #000;
      border-radius: 24px;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 12px 0 #d96d1e;
      border: 4px solid var(--amber-pale)
    }

    .print-box {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold
    }

    .print-box h3 {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px
    }

    .sep {
      border: none;
      border-top: 2px dashed #000;
      margin: .6rem 0
    }

    .pr-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px
    }

    .pr-total {
      font-weight: bold;
      font-size: 15px;
      margin-top: 6px
    }

    .print-btns {
      display: flex;
      gap: .8rem;
      margin-top: 1.5rem
    }

    .do-print,
    .cl-print {
      flex: 1;
      padding: .8rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 0 #b51c00;
      transition: transform .1s
    }

    .do-print:active,
    .cl-print:active {
      transform: translateY(4px);
      box-shadow: none
    }

    .do-print {
      background: var(--amber);
      color: #fff
    }

    .cl-print {
      background: #f3f4f6;
      color: var(--text2);
      box-shadow: 0 4px 0 #e5e7eb
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--dark);
      color: #fff;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      font-size: .9rem;
      font-weight: 700;
      z-index: 300;
      animation: fi .2s ease;
      box-shadow: 0 8px 20px rgba(80, 35, 20, 0.3);
      border: 2px solid #663322
    }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">🫓</div>
      <div class="auth-title">Acarajé da Baiana</div>
      <div class="auth-sub">Painel do operador</div>
      <input id="auth-pwd" class="auth-input" type="password" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-btn" onclick="doLogin()">Entrar</button>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="live-dot"></div>
      <div class="brand">Acarajé da Baiana <small>Painel do operador</small></div>
    </div>
    <div class="header-right">
      <span class="countdown-txt">↻ <span id="cd">30</span>s</span>
      <label class="sound-toggle">
        <input type="checkbox" id="soundOn" checked style="display:none">
        <span id="sIco">🔔</span><span id="sLbl">Som</span>
      </label>
      <button class="btn-sm btn-refresh" onclick="load(true)">⟳ Atualizar</button>
      <a href="/admin" class="btn-sm">📦 Produtos</a>
      <button class="btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat s-aguardando" onclick="setF('aguardando_pagamento')">
      <div class="stat-num" id="nAg">—</div>
      <div class="stat-lbl">⏳ Aguardando</div>
    </div>
    <div class="stat s-pago" onclick="setF('pago')">
      <div class="stat-num" id="nPg">—</div>
      <div class="stat-lbl">💳 Pago</div>
    </div>
    <div class="stat s-preparo" onclick="setF('em_preparo')">
      <div class="stat-num" id="nPr">—</div>
      <div class="stat-lbl">🔥 Em preparo</div>
    </div>
    <div class="stat s-pronto" onclick="setF('pronto')">
      <div class="stat-num" id="nPt">—</div>
      <div class="stat-lbl">✅ Pronto</div>
    </div>
    <div class="stat s-entregue" onclick="setF('entregue')">
      <div class="stat-num" id="nEn">—</div>
      <div class="stat-lbl">📦 Entregue</div>
    </div>
    <div class="stat s-fat" onclick="setF('todos')">
      <div class="stat-num" id="nFat">—</div>
      <div class="stat-lbl">💰 Faturado</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="pill active" id="f-ativos" onclick="setF('ativos')">🟠 Ativos</button>
    <button class="pill" id="f-aguardando_pagamento" onclick="setF('aguardando_pagamento')">⏳ Aguardando PIX</button>
    <button class="pill" id="f-em_preparo" onclick="setF('em_preparo')">🔥 Em preparo</button>
    <button class="pill" id="f-pronto" onclick="setF('pronto')">✅ Prontos</button>
    <button class="pill" id="f-entregue" onclick="setF('entregue')">📦 Entregues</button>
    <button class="pill" id="f-todos" onclick="setF('todos')">Todos</button>
    <input class="search" id="srch" placeholder="🔍 Nome ou tel..." oninput="render()">
  </div>

  <div class="grid" id="grid">
    <div class="loading-wrap">
      <div class="spinner"></div>Carregando...
    </div>
  </div>

  <div class="p-overlay" id="pOverlay">
    <div class="print-wrap">
      <div class="print-box" id="pBox"></div>
      <div class="print-btns">
        <button class="do-print" onclick="doPrint()">🖨️ Imprimir</button>
        <button class="cl-print" onclick="closePrint()">✕ Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://ukmbexntrxgzxgkvhpfx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWJleG50cnhnenhna3ZocGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Njk2OTUsImV4cCI6MjA5MzE0NTY5NX0.Tq_WsZGMNRDw4Zme9YBuw2i6fJIy6WYz3xFvbdcOmno';
    const SBH = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    const SBH2 = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

    let pedidos = [], filter = 'ativos', known = new Set(), cdTimer = null, cdVal = 30;

    /* AUTH */
    async function doLogin() {
      const pwd = document.getElementById('auth-pwd').value.trim();
      if (!pwd) return;
      const errEl = document.getElementById('auth-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`${SB_URL}/rest/v1/configuracoes?chave=eq.dashboard_senha&select=valor`, { headers: SBH2 });
        const data = await r.json();
        const certa = data[0]?.valor || 'baiana@2025';
        if (pwd === certa) {
          sessionStorage.setItem('dash_auth', '1');
          document.getElementById('auth-screen').classList.add('hidden');
          load(true);
        } else {
          errEl.textContent = 'Senha incorreta';
          document.getElementById('auth-pwd').select();
        }
      } catch (e) { errEl.textContent = 'Erro de conexão'; }
    }

    function doLogout() { sessionStorage.removeItem('dash_auth'); location.reload(); }

    if (sessionStorage.getItem('dash_auth') === '1') {
      document.getElementById('auth-screen').classList.add('hidden');
    }

    /* SOM */
    const sOn = document.getElementById('soundOn');
    sOn.addEventListener('change', () => {
      document.getElementById('sIco').textContent = sOn.checked ? '🔔' : '🔕';
      document.getElementById('sLbl').textContent = sOn.checked ? 'Som' : 'Mudo';
    });
    function beep() {
      if (!sOn.checked) return;
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        [[880, .0], [1100, .12], [880, .24]].forEach(([f, t]) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.frequency.value = f; o.type = 'sine';
          g.gain.setValueAtTime(0, ac.currentTime + t);
          g.gain.linearRampToValueAtTime(.3, ac.currentTime + t + .02);
          g.gain.linearRampToValueAtTime(0, ac.currentTime + t + .1);
          o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .15);
        });
      } catch (e) { }
    }

    /* CARREGAR */
    async function load(show = false) {
      if (sessionStorage.getItem('dash_auth') !== '1') return;
      if (show) document.getElementById('grid').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>Carregando...</div>';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      try {
        const r = await fetch(
          `${SB_URL}/rest/v1/pedidos?created_at=gte.${hoje.toISOString()}&select=id,telefone,nome_cliente,nome_cliente_pedido,itens,total,tipo_entrega,endereco,endereco_entrega,forma_pagamento,valor_troco,precisa_troco,status,created_at,asaas_payment_id,asaas_payment_link&order=created_at.desc&limit=200`,
          { headers: SBH2 }
        );
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        const isFirst = known.size === 0;
        if (!isFirst) {
          data.forEach(p => {
            if (!known.has(p.id)) { beep(); toast('🆕 Novo pedido — ' + (p.nome_cliente || p.nome_cliente_pedido || 'Cliente')); }
          });
        }
        known = new Set(data.map(p => p.id));
        pedidos = data; stats(); render();
      } catch (e) {
        if (show) document.getElementById('grid').innerHTML = `<div class="empty"><div class="empty-ic">⚠️</div><p>Erro: ${e.message}</p></div>`;
      }
      resetCd();
    }

    /* STATS */
    function stats() {
      const c = s => pedidos.filter(p => p.status === s).length;
      document.getElementById('nAg').textContent = c('aguardando_pagamento');
      document.getElementById('nPg').textContent = c('pago');
      document.getElementById('nPr').textContent = c('em_preparo');
      document.getElementById('nPt').textContent = c('pronto');
      document.getElementById('nEn').textContent = c('entregue');
      const fat = pedidos.filter(p => ['pago', 'em_preparo', 'pronto', 'entregue'].includes(p.status)).reduce((s, p) => s + parseFloat(p.total || 0), 0);
      document.getElementById('nFat').textContent = 'R$' + fat.toFixed(0);
    }

    function setF(f) {
      filter = f;
      document.querySelectorAll('.pill').forEach(e => e.classList.remove('active'));
      const el = document.getElementById('f-' + f); if (el) el.classList.add('active');
      render();
    }

    function getLista() {
      let l = [...pedidos];
      const q = document.getElementById('srch').value.toLowerCase().trim();
      if (filter === 'ativos') l = l.filter(p => ['aguardando_pagamento', 'pago', 'em_preparo', 'pronto', 'saiu_entrega'].includes(p.status));
      else if (filter !== 'todos') l = l.filter(p => p.status === filter);
      if (q) l = l.filter(p => {
        const n = (p.nome_cliente || p.nome_cliente_pedido || '').toLowerCase();
        return n.includes(q) || (p.telefone || '').includes(q);
      });
      return l;
    }

    const SL = {
      aguardando_pagamento: '⏳ Aguardando',
      pago: '💳 Pago',
      em_preparo: '🔥 Em preparo',
      pronto: '✅ Pronto',
      saiu_entrega: '🛵 Saiu p/ Entrega',
      entregue: '📦 Entregue',
      cancelado: '❌ Cancelado'
    };
    const R = v => 'R$' + parseFloat(v || 0).toFixed(2).replace('.', ',');
    const T = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

    /* RENDER */
    function render() {
      const l = getLista();
      const g = document.getElementById('grid');
      if (!l.length) { g.innerHTML = '<div class="empty"><div class="empty-ic">🫓</div><p>Nenhum pedido aqui</p></div>'; return; }
      g.innerHTML = l.map(p => {
        const nome = p.nome_cliente || p.nome_cliente_pedido || 'Cliente';
        const tel = p.telefone || '';
        const itens = Array.isArray(p.itens) ? p.itens : [];
        const id8 = 'Ped-' + String(p.id).slice(0, 8).toUpperCase();
        const isNew = !['entregue', 'cancelado'].includes(p.status) && (Date.now() - new Date(p.created_at).getTime()) < 120000;
        const taxa = (p.tipo_entrega === 'entrega') ? (parseFloat(p.taxa_entrega) || 5) : 0;
        const endStr = p.endereco_entrega || p.endereco || 'sem endereço';

        const iHTML = itens.map(i => {
          const qtd = i.quantidade || i.qty || 1;
          const sub = parseFloat(i.subtotal) || (parseFloat(i.preco || 0) * qtd);
          return `<div class="it-row"><span class="it-name">${i.nome || ''}</span><span class="it-qty">×${qtd}</span><span class="it-val">${R(sub)}</span></div>`;
        }).join('') + (taxa ? `<div class="it-row"><span class="it-name" style="color:var(--text3)">Taxa entrega</span><span></span><span class="it-val">R$5,00</span></div>` : '');

        const pgStr = (p.forma_pagamento || '—').toUpperCase();
        const trocoInfo = (p.precisa_troco && p.valor_troco > 0) ? ` · Troco p/ ${R(p.valor_troco)}` : '';
        const pixLink = p.asaas_payment_link ? ` · <a href="${p.asaas_payment_link}" target="_blank" style="color:var(--amber2);font-size:.7rem">Link PIX ↗</a>` : '';

        let acts = '';
        if (p.status === 'pago') acts += `<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status === 'aguardando_pagamento' && p.forma_pagamento !== 'pix') acts += `<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status === 'em_preparo') acts += `<button class="act a-pronto" onclick="upd('${p.id}','pronto')">✅ Pronto</button>`;
        else if (p.status === 'pronto' && p.tipo_entrega === 'entrega') acts += `<button class="act a-entrega" onclick="upd('${p.id}','saiu_entrega')">🛵 Saiu</button>`;
        else if (p.status === 'pronto' && p.tipo_entrega !== 'entrega') acts += `<button class="act a-entregue" onclick="upd('${p.id}','entregue')">📦 Entregar</button>`;
        else if (p.status === 'saiu_entrega') acts += `<button class="act a-entregue" onclick="upd('${p.id}','entregue')">📦 Entregue</button>`;
        if (!['entregue', 'cancelado'].includes(p.status)) acts += `<button class="act a-cancel" onclick="upd('${p.id}','cancelado')" title="Cancelar">✕</button>`;
        acts += `<button class="act a-print" onclick="openPrint('${p.id}')">🖨️</button>`;

        return `<div class="card${isNew ? ' is-new' : ''}" id="c-${p.id}">
<div class="card-top"><div><div class="order-id">${id8}</div><div class="order-hr">${T(p.created_at)}</div></div><span class="badge b-${p.status}">${SL[p.status] || p.status}</span></div>
<div class="card-body">
  <div class="cli-name">${nome}</div><div class="cli-tel">${tel}</div>
  <div class="info-row"><span class="ic">${p.tipo_entrega === 'entrega' ? '🛵' : '🏃'}</span><span>${p.tipo_entrega === 'entrega' ? 'Entrega — ' + endStr : 'Retirada no local'}</span></div>
  <div class="info-row"><span class="ic">${p.forma_pagamento === 'pix' ? '💳' : '💵'}</span><span>${pgStr}${trocoInfo}${pixLink}</span></div>
  <div class="items-box">${iHTML || '<span style="color:var(--text3);font-size:.78rem">Sem itens</span>'}</div>
  <div class="tot-row"><span class="tot-lbl">Total</span><span class="tot-val">${R(p.total)}</span></div>
</div>
<div class="card-actions">${acts}</div></div>`;
      }).join('');
    }

    /* ATUALIZAR STATUS */
    async function upd(id, st) {
      const btns = document.querySelectorAll(`#c-${id} .act`);
      btns.forEach(b => b.disabled = true);
      try {
        const r = await fetch(`${SB_URL}/rest/v1/pedidos?id=eq.${id}`, {
          method: 'PATCH', headers: { ...SBH, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: st })
        });
        if (!r.ok) {
          const errText = await r.text();
          throw new Error(`${r.status}: ${errText}`);
        }
        const p = pedidos.find(x => x.id === id);
        if (p) p.status = st;
        stats(); render(); toast('Status: ' + (SL[st] || st));
      } catch (e) { toast('Erro: ' + e.message); btns.forEach(b => b.disabled = false); }
    }

    /* IMPRESSÃO */
    function openPrint(id) {
      const p = pedidos.find(x => x.id === id); if (!p) return;
      const nome = p.nome_cliente || p.nome_cliente_pedido || 'Cliente';
      const tel = p.telefone || '';
      const id8 = 'Ped-' + String(p.id).slice(0, 8).toUpperCase();
      const itens = Array.isArray(p.itens) ? p.itens : [];
      const taxa = p.tipo_entrega === 'entrega' ? 5 : 0;
      const data = new Date(p.created_at).toLocaleString('pt-BR');
      const endStr = p.endereco || p.endereco_entrega || '';
      const iRows = itens.map(i => { const qtd = i.quantidade || i.qty || 1; const sub = parseFloat(i.subtotal) || (parseFloat(i.preco || 0) * qtd); return `<div class="pr-row"><span>${qtd}x ${i.nome || ''}</span><span>${R(sub)}</span></div>`; }).join('');
      const taxaRow = taxa ? `<div class="pr-row"><span>Taxa entrega</span><span>R$5,00</span></div>` : '';
      const trocoRow = (p.precisa_troco && p.valor_troco > 0) ? `<div class="pr-row"><span>Troco para</span><span>${R(p.valor_troco)}</span></div>` : '';
      document.getElementById('pBox').innerHTML = `<h3>🫓 ACARAJÉ DA BAIANA</h3><div style="text-align:center;font-size:10px;color:#888">${data}</div><hr class="sep"><div><strong>Pedido ${id8}</strong></div><div>Cliente: ${nome}</div><div>Tel: ${tel}</div><hr class="sep"><div><strong>${p.tipo_entrega === 'entrega' ? '🛵 ENTREGA' : '🏃 RETIRADA'}</strong></div>${p.tipo_entrega === 'entrega' && endStr ? `<div style="font-size:10px">${endStr}</div>` : ''}<hr class="sep"><strong>ITENS</strong>${iRows}${taxaRow}<hr class="sep"><div class="pr-row pr-total"><span>TOTAL</span><span>${R(p.total)}</span></div>${trocoRow}<div style="font-size:10px;color:#666">Pgto: ${(p.forma_pagamento || '—').toUpperCase()} · Status: ${SL[p.status] || p.status}</div><hr class="sep"><div style="text-align:center;font-size:10px;color:#aaa">Obrigada pela preferência! 💛</div>`;
      document.getElementById('pOverlay').classList.add('open');
    }
    function doPrint() { const c = document.getElementById('pBox').innerHTML; const w = window.open('', '_blank', 'width=380,height=620'); w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pedido</title><style>body{font-family:'Courier New',monospace;font-size:12px;padding:1cm;max-width:8cm;margin:0 auto}h3{font-size:13px;text-align:center}.sep{border:none;border-top:1px dashed #000;margin:.4rem 0}.pr-row{display:flex;justify-content:space-between}.pr-total{font-weight:bold;font-size:13px}</style></head><body>${c}<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),500)}<\/script></body></html>`); w.document.close(); }
    function closePrint() { document.getElementById('pOverlay').classList.remove('open'); }
    document.getElementById('pOverlay').addEventListener('click', e => { if (e.target === document.getElementById('pOverlay')) closePrint(); });

    /* COUNTDOWN */
    function resetCd() { clearInterval(cdTimer); cdVal = 30; document.getElementById('cd').textContent = cdVal; cdTimer = setInterval(() => { cdVal--; document.getElementById('cd').textContent = cdVal; if (cdVal <= 0) { clearInterval(cdTimer); load(); } }, 1000); }

    /* TOAST */
    let tTimer = null;
    function toast(msg) { clearTimeout(tTimer); let t = document.querySelector('.toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); tTimer = setTimeout(() => t.remove(), 3000); }

    if (sessionStorage.getItem('dash_auth') === '1') load(true);
  </script>
</body>

</html>
