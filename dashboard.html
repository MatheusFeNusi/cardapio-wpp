<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Acarajé da Baiana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0F0B06;--surface:#1A1208;--card:#211608;--border:#3A2810;--border2:#5A3E1A;
      --amber:#C1520A;--amber2:#E8720E;--amber-pale:#2A1800;--gold:#C89010;
      --green:#22763A;--green-pale:#0D2E18;--blue:#1A5FA0;--blue-pale:#0A2040;
      --red:#A02020;--red-pale:#2A0A0A;--text:#F0E8D8;--text2:#A09070;--text3:#60503A;--radius:10px
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* AUTH */
    #auth-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
    #auth-screen.hidden{display:none}
    .auth-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:340px;text-align:center}
    .auth-logo{font-size:2.5rem;margin-bottom:.5rem}
    .auth-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:var(--amber2);margin-bottom:.3rem}
    .auth-sub{font-size:.8rem;color:var(--text3);margin-bottom:1.8rem}
    .auth-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;margin-bottom:.8rem;text-align:center;letter-spacing:.15em}
    .auth-input:focus{border-color:var(--amber)}
    .auth-btn{width:100%;background:var(--amber);border:none;border-radius:8px;padding:.75rem;color:#fff;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s}
    .auth-btn:hover{background:var(--amber2)}
    .auth-err{color:#E05050;font-size:.8rem;margin-top:.6rem;min-height:1.1rem}

    /* HEADER */
    .header{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:.8rem}
    .brand{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--amber2)}
    .brand small{color:var(--text2);font-weight:600;font-size:.8rem;display:block;margin-top:-1px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#22A050;animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,160,80,.4)}70%{box-shadow:0 0 0 8px rgba(34,160,80,0)}100%{box-shadow:0 0 0 0}}
    .header-right{display:flex;align-items:center;gap:.8rem}
    .countdown-txt{font-size:.75rem;color:var(--text3);font-family:'DM Mono',monospace}
    .btn-sm{background:var(--card);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:.38rem .85rem;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block}
    .btn-sm:hover{border-color:var(--amber);color:var(--amber2)}
    .btn-refresh{background:var(--amber-pale);border-color:#5A3000;color:var(--amber2)}
    .btn-refresh:hover{background:#3A2000}
    .sound-toggle{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--text3);cursor:pointer;user-select:none}
    .sound-toggle:hover{color:var(--text2)}

    /* STATS */
    .stats{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
    .stat{flex:1;background:var(--surface);padding:.65rem 1rem;cursor:pointer;transition:background .15s;position:relative}
    .stat:hover,.stat.active{background:var(--card)}
    .stat.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--amber)}
    .stat-num{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;line-height:1}
    .stat-lbl{font-size:.65rem;color:var(--text3);margin-top:.15rem;text-transform:uppercase;letter-spacing:.06em}
    .s-aguardando .stat-num{color:var(--gold)}.s-pago .stat-num{color:#4A90D9}
    .s-preparo .stat-num{color:#E8B420}.s-pronto .stat-num{color:#3AB860}
    .s-entregue .stat-num{color:var(--text3)}.s-fat .stat-num{color:var(--amber2)}

    /* TOOLBAR */
    .toolbar{padding:.7rem 1.5rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
    .pill{background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:999px;padding:.28rem .8rem;font-size:.75rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
    .pill:hover{border-color:var(--amber);color:var(--amber2)}
    .pill.active{background:var(--amber);border-color:var(--amber);color:#fff}
    .search{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.32rem .7rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;width:170px;outline:none;transition:border-color .15s;margin-left:auto}
    .search:focus{border-color:var(--amber)}.search::placeholder{color:var(--text3)}

    /* GRID */
    .grid{padding:1.2rem 1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:.9rem;align-items:start}
    .empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text3)}
    .empty-ic{font-size:2.5rem;margin-bottom:.7rem}
    .loading-wrap{grid-column:1/-1;text-align:center;padding:3rem;color:var(--text3)}
    .spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .8rem}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s;animation:fi .2s ease}
    .card:hover{border-color:var(--border2)}.card.is-new{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
    .card-top{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
    .order-id{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--text3)}
    .order-hr{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text3)}
    .badge{font-size:.64rem;font-weight:500;padding:.18rem .6rem;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
    .b-aguardando_pagamento{background:var(--amber-pale);color:var(--gold);border:1px solid #5A3A00}
    .b-pago{background:var(--blue-pale);color:#5AA0E0;border:1px solid #1A3060}
    .b-em_preparo{background:#2A1E00;color:#E8B420;border:1px solid #5A4000}
    .b-pronto{background:var(--green-pale);color:#3AB860;border:1px solid #1A5030}
    .b-entregue{background:var(--surface);color:var(--text3);border:1px solid var(--border)}
    .b-cancelado{background:var(--red-pale);color:#E05050;border:1px solid #5A1A1A}
    .card-body{padding:.85rem 1rem}
    .cli-name{font-size:1rem;font-weight:500;margin-bottom:.15rem}
    .cli-tel{font-size:.72rem;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:.5rem}
    .info-row{display:flex;align-items:baseline;gap:.4rem;font-size:.78rem;color:var(--text2);margin-bottom:.3rem}
    .ic{font-size:.85rem}
    .items-box{border-top:1px solid var(--border);margin-top:.6rem;padding-top:.6rem}
    .it-row{display:flex;align-items:baseline;gap:.4rem;font-size:.78rem;margin-bottom:.25rem}
    .it-name{flex:1;color:var(--text2)}.it-qty{color:var(--text3);font-family:'DM Mono',monospace;font-size:.7rem;white-space:nowrap}
    .it-val{color:var(--text);font-family:'DM Mono',monospace;font-size:.75rem;white-space:nowrap}
    .tot-row{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--border)}
    .tot-lbl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
    .tot-val{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;color:var(--amber2)}
    .card-actions{display:flex;gap:.4rem;padding:.65rem .75rem;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
    .act{flex:1;min-width:70px;padding:.38rem .5rem;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.72rem;cursor:pointer;transition:all .15s;white-space:nowrap}
    .act:hover{border-color:var(--amber);color:var(--amber2)}.act:disabled{opacity:.4;cursor:default}
    .a-preparo{background:#2A1E00;border-color:#6A4A00;color:#E8B420}.a-preparo:hover{background:#3A2A00;border-color:#E8B420}
    .a-pronto{background:var(--green-pale);border-color:#2A6040;color:#3AB860}.a-pronto:hover{background:#143020;border-color:#3AB860}
    .a-entregue{background:var(--blue-pale);border-color:#204070;color:#5AA0E0}.a-entregue:hover{background:#102840}
    .a-cancel{flex:0;min-width:32px;border-color:var(--red-pale);color:#E05050}.a-cancel:hover{background:var(--red-pale);border-color:var(--red)}
    .a-print{flex:0;min-width:32px;font-size:.7rem}

    /* PRINT */
    .p-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
    .p-overlay.open{display:flex}
    .print-wrap{background:#fff;color:#000;border-radius:12px;padding:1.5rem;max-width:360px;width:90%;max-height:90vh;overflow-y:auto}
    .print-box{font-family:'Courier New',monospace;font-size:12px}.print-box h3{text-align:center;font-size:13px}
    .sep{border:none;border-top:1px dashed #000;margin:.4rem 0}.pr-row{display:flex;justify-content:space-between}
    .pr-total{font-weight:bold;font-size:13px}
    .print-btns{display:flex;gap:.5rem;margin-top:1rem}
    .do-print,.cl-print{flex:1;padding:.6rem;border:none;border-radius:8px;cursor:pointer;font-size:.85rem}
    .do-print{background:#000;color:#fff}.cl-print{background:#f0f0f0;color:#333}

    /* TOAST */
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:.6rem 1rem;font-size:.82rem;z-index:300;animation:fi .2s ease}
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">🫓</div>
      <div class="auth-title">Acarajé da Baiana</div>
      <div class="auth-sub">Painel do operador</div>
      <input id="auth-pwd" class="auth-input" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="auth-btn" onclick="doLogin()">Entrar</button>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="live-dot"></div>
      <div class="brand">Acarajé da Baiana <small>Painel do operador</small></div>
    </div>
    <div class="header-right">
      <span class="countdown-txt">↻ <span id="cd">30</span>s</span>
      <label class="sound-toggle">
        <input type="checkbox" id="soundOn" checked style="display:none">
        <span id="sIco">🔔</span><span id="sLbl">Som</span>
      </label>
      <button class="btn-sm btn-refresh" onclick="load(true)">⟳ Atualizar</button>
      <a href="/admin" class="btn-sm">📦 Produtos</a>
      <button class="btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat s-aguardando" onclick="setF('aguardando_pagamento')"><div class="stat-num" id="nAg">—</div><div class="stat-lbl">⏳ Aguardando</div></div>
    <div class="stat s-pago" onclick="setF('pago')"><div class="stat-num" id="nPg">—</div><div class="stat-lbl">💳 Pago</div></div>
    <div class="stat s-preparo" onclick="setF('em_preparo')"><div class="stat-num" id="nPr">—</div><div class="stat-lbl">🔥 Em preparo</div></div>
    <div class="stat s-pronto" onclick="setF('pronto')"><div class="stat-num" id="nPt">—</div><div class="stat-lbl">✅ Pronto</div></div>
    <div class="stat s-entregue" onclick="setF('entregue')"><div class="stat-num" id="nEn">—</div><div class="stat-lbl">📦 Entregue</div></div>
    <div class="stat s-fat" onclick="setF('todos')"><div class="stat-num" id="nFat">—</div><div class="stat-lbl">💰 Faturado</div></div>
  </div>

  <div class="toolbar">
    <button class="pill active" id="f-ativos" onclick="setF('ativos')">🟠 Ativos</button>
    <button class="pill" id="f-aguardando_pagamento" onclick="setF('aguardando_pagamento')">⏳ Aguardando PIX</button>
    <button class="pill" id="f-em_preparo" onclick="setF('em_preparo')">🔥 Em preparo</button>
    <button class="pill" id="f-pronto" onclick="setF('pronto')">✅ Prontos</button>
    <button class="pill" id="f-entregue" onclick="setF('entregue')">📦 Entregues</button>
    <button class="pill" id="f-todos" onclick="setF('todos')">Todos</button>
    <input class="search" id="srch" placeholder="🔍 Nome ou tel..." oninput="render()">
  </div>

  <div class="grid" id="grid"><div class="loading-wrap"><div class="spinner"></div>Carregando...</div></div>

  <div class="p-overlay" id="pOverlay">
    <div class="print-wrap">
      <div class="print-box" id="pBox"></div>
      <div class="print-btns">
        <button class="do-print" onclick="doPrint()">🖨️ Imprimir</button>
        <button class="cl-print" onclick="closePrint()">✕ Fechar</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://ukmbexntrxgzxgkvhpfx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrbWJleG50cnhnenhna3ZocGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Njk2OTUsImV4cCI6MjA5MzE0NTY5NX0.Tq_WsZGMNRDw4Zme9YBuw2i6fJIy6WYz3xFvbdcOmno';
    const SBH  = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    const SBH2 = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

    let pedidos = [], filter = 'ativos', known = new Set(), cdTimer = null, cdVal = 30;

    /* AUTH */
    async function doLogin() {
      const pwd = document.getElementById('auth-pwd').value.trim();
      if (!pwd) return;
      const errEl = document.getElementById('auth-err');
      errEl.textContent = '';
      try {
        const r = await fetch(`${SB_URL}/rest/v1/configuracoes?chave=eq.dashboard_senha&select=valor`, { headers: SBH2 });
        const data = await r.json();
        const certa = data[0]?.valor || 'baiana@2025';
        if (pwd === certa) {
          sessionStorage.setItem('dash_auth','1');
          document.getElementById('auth-screen').classList.add('hidden');
          load(true);
        } else {
          errEl.textContent = 'Senha incorreta';
          document.getElementById('auth-pwd').select();
        }
      } catch(e) { errEl.textContent = 'Erro de conexão'; }
    }

    function doLogout() { sessionStorage.removeItem('dash_auth'); location.reload(); }

    if (sessionStorage.getItem('dash_auth') === '1') {
      document.getElementById('auth-screen').classList.add('hidden');
    }

    /* SOM */
    const sOn = document.getElementById('soundOn');
    sOn.addEventListener('change', () => {
      document.getElementById('sIco').textContent = sOn.checked ? '🔔' : '🔕';
      document.getElementById('sLbl').textContent = sOn.checked ? 'Som' : 'Mudo';
    });
    function beep() {
      if (!sOn.checked) return;
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        [[880,.0],[1100,.12],[880,.24]].forEach(([f,t]) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.connect(g); g.connect(ac.destination);
          o.frequency.value = f; o.type = 'sine';
          g.gain.setValueAtTime(0, ac.currentTime+t);
          g.gain.linearRampToValueAtTime(.3, ac.currentTime+t+.02);
          g.gain.linearRampToValueAtTime(0, ac.currentTime+t+.1);
          o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.15);
        });
      } catch(e){}
    }

    /* CARREGAR */
    async function load(show=false) {
      if (sessionStorage.getItem('dash_auth') !== '1') return;
      if (show) document.getElementById('grid').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>Carregando...</div>';
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      try {
        const r = await fetch(
          `${SB_URL}/rest/v1/pedidos?created_at=gte.${hoje.toISOString()}&select=id,telefone,nome_cliente,nome_cliente_pedido,itens,total,tipo_entrega,endereco,endereco_entrega,forma_pagamento,valor_troco,precisa_troco,status,created_at,asaas_payment_id,asaas_payment_link&order=created_at.desc&limit=200`,
          { headers: SBH2 }
        );
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        const isFirst = known.size === 0;
        if (!isFirst) {
          data.forEach(p => {
            if (!known.has(p.id)) { beep(); toast('🆕 Novo pedido — ' + (p.nome_cliente||p.nome_cliente_pedido||'Cliente')); }
          });
        }
        known = new Set(data.map(p => p.id));
        pedidos = data; stats(); render();
      } catch(e) {
        if (show) document.getElementById('grid').innerHTML = `<div class="empty"><div class="empty-ic">⚠️</div><p>Erro: ${e.message}</p></div>`;
      }
      resetCd();
    }

    /* STATS */
    function stats() {
      const c = s => pedidos.filter(p => p.status===s).length;
      document.getElementById('nAg').textContent = c('aguardando_pagamento');
      document.getElementById('nPg').textContent = c('pago');
      document.getElementById('nPr').textContent = c('em_preparo');
      document.getElementById('nPt').textContent = c('pronto');
      document.getElementById('nEn').textContent = c('entregue');
      const fat = pedidos.filter(p => ['pago','em_preparo','pronto','entregue'].includes(p.status)).reduce((s,p) => s+parseFloat(p.total||0),0);
      document.getElementById('nFat').textContent = 'R$'+fat.toFixed(0);
    }

    function setF(f) {
      filter = f;
      document.querySelectorAll('.pill').forEach(e => e.classList.remove('active'));
      const el = document.getElementById('f-'+f); if (el) el.classList.add('active');
      render();
    }

    function getLista() {
      let l = [...pedidos];
      const q = document.getElementById('srch').value.toLowerCase().trim();
      if (filter==='ativos') l = l.filter(p => ['aguardando_pagamento','pago','em_preparo','pronto'].includes(p.status));
      else if (filter!=='todos') l = l.filter(p => p.status===filter);
      if (q) l = l.filter(p => {
        const n = (p.nome_cliente||p.nome_cliente_pedido||'').toLowerCase();
        return n.includes(q)||(p.telefone||'').includes(q);
      });
      return l;
    }

    const SL = { aguardando_pagamento:'⏳ Aguardando PIX', pago:'💳 Pago', em_preparo:'🔥 Em preparo', pronto:'✅ Pronto', entregue:'📦 Entregue', cancelado:'❌ Cancelado' };
    const R = v => 'R$'+parseFloat(v||0).toFixed(2).replace('.',',');
    const T = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—';

    /* RENDER */
    function render() {
      const l = getLista();
      const g = document.getElementById('grid');
      if (!l.length) { g.innerHTML = '<div class="empty"><div class="empty-ic">🫓</div><p>Nenhum pedido aqui</p></div>'; return; }
      g.innerHTML = l.map(p => {
        const nome   = p.nome_cliente||p.nome_cliente_pedido||'Cliente';
        const tel    = p.telefone||'';
        const itens  = Array.isArray(p.itens)?p.itens:[];
        const id8    = 'Ped-'+String(p.id).slice(0,8).toUpperCase();
        const isNew  = !['entregue','cancelado'].includes(p.status)&&(Date.now()-new Date(p.created_at).getTime())<120000;
        const taxa   = p.tipo_entrega==='entrega'?5:0;
        const endStr = p.endereco||p.endereco_entrega||'sem endereço';

        const iHTML = itens.map(i=>{
          const qtd = i.quantidade||i.qty||1;
          const sub = parseFloat(i.subtotal)||(parseFloat(i.preco||0)*qtd);
          return `<div class="it-row"><span class="it-name">${i.nome||''}</span><span class="it-qty">×${qtd}</span><span class="it-val">${R(sub)}</span></div>`;
        }).join('')+(taxa?`<div class="it-row"><span class="it-name" style="color:var(--text3)">Taxa entrega</span><span></span><span class="it-val">R$5,00</span></div>`:'');

        const pgStr    = (p.forma_pagamento||'—').toUpperCase();
        const trocoInfo= (p.precisa_troco&&p.valor_troco>0)?` · Troco p/ ${R(p.valor_troco)}`:'';
        const pixLink  = p.asaas_payment_link?` · <a href="${p.asaas_payment_link}" target="_blank" style="color:var(--amber2);font-size:.7rem">Link PIX ↗</a>`:'';

        let acts = '';
        if (p.status==='pago') acts+=`<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status==='aguardando_pagamento'&&p.forma_pagamento!=='pix') acts+=`<button class="act a-preparo" onclick="upd('${p.id}','em_preparo')">🔥 Iniciar</button>`;
        else if (p.status==='em_preparo') acts+=`<button class="act a-pronto" onclick="upd('${p.id}','pronto')">✅ Pronto</button>`;
        else if (p.status==='pronto') acts+=`<button class="act a-entregue" onclick="upd('${p.id}','entregue')">📦 Entregar</button>`;
        if (!['entregue','cancelado'].includes(p.status)) acts+=`<button class="act a-cancel" onclick="upd('${p.id}','cancelado')" title="Cancelar">✕</button>`;
        acts+=`<button class="act a-print" onclick="openPrint('${p.id}')">🖨️</button>`;

        return `<div class="card${isNew?' is-new':''}" id="c-${p.id}">
<div class="card-top"><div><div class="order-id">${id8}</div><div class="order-hr">${T(p.created_at)}</div></div><span class="badge b-${p.status}">${SL[p.status]||p.status}</span></div>
<div class="card-body">
  <div class="cli-name">${nome}</div><div class="cli-tel">${tel}</div>
  <div class="info-row"><span class="ic">${p.tipo_entrega==='entrega'?'🛵':'🏃'}</span><span>${p.tipo_entrega==='entrega'?'Entrega — '+endStr:'Retirada no local'}</span></div>
  <div class="info-row"><span class="ic">${p.forma_pagamento==='pix'?'💳':'💵'}</span><span>${pgStr}${trocoInfo}${pixLink}</span></div>
  <div class="items-box">${iHTML||'<span style="color:var(--text3);font-size:.78rem">Sem itens</span>'}</div>
  <div class="tot-row"><span class="tot-lbl">Total</span><span class="tot-val">${R(p.total)}</span></div>
</div>
<div class="card-actions">${acts}</div></div>`;
      }).join('');
    }

    /* ATUALIZAR STATUS */
    async function upd(id, st) {
      const btns = document.querySelectorAll(`#c-${id} .act`);
      btns.forEach(b => b.disabled=true);
      try {
        const r = await fetch(`${SB_URL}/rest/v1/pedidos?id=eq.${id}`,{
          method:'PATCH', headers:{...SBH, Prefer:'return=minimal'},
          body: JSON.stringify({ status: st, atualizado_em: new Date().toISOString() })
        });
        if (!r.ok) throw new Error(r.status);
        const p = pedidos.find(x => x.id===id);
        if (p) p.status = st;
        stats(); render(); toast('Status: '+(SL[st]||st));
      } catch(e) { toast('Erro: '+e.message); btns.forEach(b => b.disabled=false); }
    }

    /* IMPRESSÃO */
    function openPrint(id) {
      const p = pedidos.find(x => x.id===id); if (!p) return;
      const nome  = p.nome_cliente||p.nome_cliente_pedido||'Cliente';
      const tel   = p.telefone||'';
      const id8   = 'Ped-'+String(p.id).slice(0,8).toUpperCase();
      const itens = Array.isArray(p.itens)?p.itens:[];
      const taxa  = p.tipo_entrega==='entrega'?5:0;
      const data  = new Date(p.created_at).toLocaleString('pt-BR');
      const endStr= p.endereco||p.endereco_entrega||'';
      const iRows = itens.map(i=>{const qtd=i.quantidade||i.qty||1;const sub=parseFloat(i.subtotal)||(parseFloat(i.preco||0)*qtd);return `<div class="pr-row"><span>${qtd}x ${i.nome||''}</span><span>${R(sub)}</span></div>`;}).join('');
      const taxaRow  = taxa?`<div class="pr-row"><span>Taxa entrega</span><span>R$5,00</span></div>`:'';
      const trocoRow = (p.precisa_troco&&p.valor_troco>0)?`<div class="pr-row"><span>Troco para</span><span>${R(p.valor_troco)}</span></div>`:'';
      document.getElementById('pBox').innerHTML = `<h3>🫓 ACARAJÉ DA BAIANA</h3><div style="text-align:center;font-size:10px;color:#888">${data}</div><hr class="sep"><div><strong>Pedido ${id8}</strong></div><div>Cliente: ${nome}</div><div>Tel: ${tel}</div><hr class="sep"><div><strong>${p.tipo_entrega==='entrega'?'🛵 ENTREGA':'🏃 RETIRADA'}</strong></div>${p.tipo_entrega==='entrega'&&endStr?`<div style="font-size:10px">${endStr}</div>`:''}<hr class="sep"><strong>ITENS</strong>${iRows}${taxaRow}<hr class="sep"><div class="pr-row pr-total"><span>TOTAL</span><span>${R(p.total)}</span></div>${trocoRow}<div style="font-size:10px;color:#666">Pgto: ${(p.forma_pagamento||'—').toUpperCase()} · Status: ${SL[p.status]||p.status}</div><hr class="sep"><div style="text-align:center;font-size:10px;color:#aaa">Obrigada pela preferência! 💛</div>`;
      document.getElementById('pOverlay').classList.add('open');
    }
    function doPrint(){const c=document.getElementById('pBox').innerHTML;const w=window.open('','_blank','width=380,height=620');w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Pedido</title><style>body{font-family:'Courier New',monospace;font-size:12px;padding:1cm;max-width:8cm;margin:0 auto}h3{font-size:13px;text-align:center}.sep{border:none;border-top:1px dashed #000;margin:.4rem 0}.pr-row{display:flex;justify-content:space-between}.pr-total{font-weight:bold;font-size:13px}</style></head><body>${c}<script>window.onload=()=>{window.print();setTimeout(()=>window.close(),500)}<\/script></body></html>`);w.document.close();}
    function closePrint(){document.getElementById('pOverlay').classList.remove('open');}
    document.getElementById('pOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('pOverlay'))closePrint();});

    /* COUNTDOWN */
    function resetCd(){clearInterval(cdTimer);cdVal=30;document.getElementById('cd').textContent=cdVal;cdTimer=setInterval(()=>{cdVal--;document.getElementById('cd').textContent=cdVal;if(cdVal<=0){clearInterval(cdTimer);load();}},1000);}

    /* TOAST */
    let tTimer=null;
    function toast(msg){clearTimeout(tTimer);let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);tTimer=setTimeout(()=>t.remove(),3000);}

    if (sessionStorage.getItem('dash_auth')==='1') load(true);
  </script>
</body>
</html>
